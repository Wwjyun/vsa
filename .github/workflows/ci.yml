name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Test
        run: pytest
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_DISABLE_SANDBOX: "1"
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu --disable-software-rasterizer

      - name: Check dependency consistency
        run: python -m pip check

  package:
    runs-on: windows-latest
    needs: quality
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Build the one-folder bundle
        run: pyinstaller vsa.spec --noconfirm --clean

      - name: Smoke-test the packaged application
        run: dist\VSA\VSA.exe --smoke-test
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_DISABLE_SANDBOX: "1"
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu --disable-software-rasterizer

      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: VSA-windows
          path: dist/VSA
          retention-days: 7
