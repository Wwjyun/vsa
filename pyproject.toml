[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "vsa-portfolio"
version = "0.4.1"
description = "PySide6 desktop application for visual stage analysis of manufacturing defect maps"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "PySide6==6.11.2",
    "pandas==3.0.5",
    "plotly==7.0.0",
    "dash==4.4.1",
    "Flask==3.1.3",
    "Werkzeug==3.1.8",
    "Pillow==12.3.0",
]

[project.scripts]
vsa = "vsa.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"vsa.resources" = ["*.json"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
# "." keeps `scripts` importable so a bare `pytest` (as CI runs it) matches `python -m pytest`.
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = ["env", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
line-ending = "auto"
